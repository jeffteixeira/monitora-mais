name: CI e deploy no GitHub Pages

# dev: roda testes e build, sem publicar.
# main: além disso, publica no GitHub Pages (o site em produção).
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Um build por branch; um novo push cancela o anterior da mesma branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Só publica a partir da main (push ou execução manual), nunca em pull request.
  PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test -- --watch=false

      # Pages só serve arquivos estáticos: build sem servidor e com a base do repositório.
      - name: Build
        run: npx ng build --output-mode static --base-href "/${{ github.event.repository.name }}/"

      # Pages não reescreve rotas: o 404 carrega o app e o roteador resolve a URL.
      - name: Fallback de rotas (SPA)
        run: cp dist/timebanking-angular-supabase/browser/index.csr.html dist/timebanking-angular-supabase/browser/404.html

      - uses: actions/configure-pages@v5
        if: env.PUBLISH == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: env.PUBLISH == 'true'
        with:
          path: dist/timebanking-angular-supabase/browser

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Um deploy por vez e sem cancelar um em andamento.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
